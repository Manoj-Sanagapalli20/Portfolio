# ── Netlify Production Configuration ──────────────────────────
# Build settings
[build]
  command   = "npm run build"   # Run Vite production build
  publish   = "dist"            # Serve the built output folder

# ── Environment Variables (set in Netlify dashboard, not here) ─
#  No secrets committed to git.

# ── Headers: security + performance ───────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── SPA Redirect: all routes fall back to index.html ──────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
